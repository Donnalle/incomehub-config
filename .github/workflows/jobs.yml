name: Real jobs feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (Claude enriches new jobs when ANTHROPIC_API_KEY is set)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-jobs.mjs"
      - ".github/workflows/jobs.yml"

permissions:
  contents: write

concurrency:
  group: jobs-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Freelancer jobs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-jobs.mjs
      - name: Commit jobs.json
        run: |
          git config user.name "incomehub-bot"
          git config user.email "incomehub-bot@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update jobs feed"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
